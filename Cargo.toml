[package]
name = "sysex-drop"
version = "1.5.0"
authors = ["Oliver Rockstedt <info@sourcebox.de>"]
license = "MIT"
edition = "2024"
rust-version = "1.95"
description = "Drag-and-drop MIDI SysEx dump utility"
homepage = "https://github.com/sourcebox/sysex-drop"
repository = "https://github.com/sourcebox/sysex-drop"

[dependencies]
anyhow = "1.0.104"
log = { version = "0.4.33", features = [
  "max_level_debug",
  "release_max_level_info",
] }
midir = "0.11.0"
midly = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
simple_logger = "5.2.0"
eframe = { version = "0.36.1", features = ["persistence"] }

[profile.release]
strip = true

[package.metadata.bundle]
icon = [
  "icons/32x32/sysex-drop.png",
  "icons/128x128/sysex-drop.png",
  "icons/256x256/sysex-drop.png",
]
identifier = "de.sourcebox.sysex-drop"
name = "SysEx Drop"
osx_minimum_system_version = "10.13"
